# actionlint.yaml
#
# CI dispatches the GPU legs to self-hosted boxes by label; actionlint rejects
# any label it does not know unless they are declared here.

self-hosted-runner:
  labels:
    - cpu
    - gpu
    # The box reserved for benchmarking. Separate from `gpu` on purpose: a
    # measurement sharing a card with a test run measures the test run too.
    - bench
